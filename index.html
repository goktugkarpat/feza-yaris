<script id="uygulama-onbellek">
(() => {
  if (!('serviceWorker' in navigator) || !location.protocol.startsWith('http') || /[?&]kucuk(&|=|$)/.test(location.search)) return;
  const sw = navigator.serviceWorker, oncedenVardi = !!sw.controller;
  let yenilemeBekliyor = false, yenilendi = false;
  function guvenliYenile() {
    if (!yenilemeBekliyor || yenilendi) return;
    // Yeni dosyalar hazır olduğunda yalnız seçim ekranında yenile; devam eden yarışı bölme.
    if (window.YARIS && YARIS.durum !== 'baslik') return;
    yenilendi = true; location.reload();
  }
  sw.addEventListener('controllerchange', () => { if (oncedenVardi) { yenilemeBekliyor = true; guvenliYenile(); } });
  if (typeof OLAY !== 'undefined') OLAY.on('durum', d => { if (d === 'baslik') guvenliYenile(); });
  navigator.serviceWorker.register('sw.js').catch(() => { /* Dosyadan veya çevrimdışı açılışta oyun çalışmayı sürdürür. */ });
})();
</script>
